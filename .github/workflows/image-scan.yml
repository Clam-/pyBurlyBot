---
# Generated fleet pattern. Policy and target details: .github/maintenance.json.
# A vulnerability is a finding; scanner, registry, and API errors fail the run.
name: Maintenance security scan

on:
  schedule:
    - cron: "24 6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Docker image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  packages: read
  actions: write
  issues: write
  security-events: write

concurrency:
  group: maintenance-security
  cancel-in-progress: false


jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: yuzuyuzuyu/repo-automation/actions/security-scan@bafecef23e3e78a650eeda22b43691f03b49298d # v1.0.8
      with:
        upload-sarif: 'true'
        rebuild-workflow: docker-image.yml
