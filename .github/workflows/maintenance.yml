---
name: Maintenance watchdog

on:
  schedule:
    - cron: "26 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

concurrency:
  group: maintenance-watchdog
  cancel-in-progress: false


jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: yuzuyuzuyu/repo-automation/actions/watchdog@b48b58400ea37a5fd7537888a97d606b2655ef4c # v1.0.10
